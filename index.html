<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1f2d20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rabbit Meadow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>Rabbit Meadow</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f2d20;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:#1f2d20}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#7db85b}#hud{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));color:#fff;background:#263b2dcc;padding:5px 6px;border-radius:8px;font-size:9px;display:grid;grid-template-columns:auto 52px;gap:3px 5px;align-items:center}.bar{height:6px;background:#0005;border:1px solid #fff5}.fill{height:100%}#hunger{background:#ffd66b}#thirst{background:#6ec8ff}#homeNeed{background:#e4a7ff}#sleepNeed{background:#9bb7ff}#mute{position:absolute;right:max(8px,env(safe-area-inset-right));top:74px;border:0;background:#263b2dcc;color:#fff;border-radius:6px;padding:4px 7px}#pad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:108px;height:108px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;opacity:.64}.btn,#act{border:0;border-radius:10px;background:#ffffff28;color:#fff;font-size:17px;user-select:none;-webkit-user-select:none}.btn:active,#act:active{background:#ffffff55}.empty{visibility:hidden}#act{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;font-size:10px}@media(hover:hover) and (pointer:fine){#pad,#act{opacity:.28}}@media(orientation:portrait){#wrap{transform:rotate(90deg);width:100vh;height:100vw;position:absolute;left:50%;top:50%;margin-left:-50vh;margin-top:-50vw}}</style></head><body><div id="wrap"><canvas id="game" width="320" height="180"></canvas><div id="hud"><span>おなか</span><div class="bar"><div id="hunger" class="fill"></div></div><span>のど</span><div class="bar"><div id="thirst" class="fill"></div></div><span>おうち</span><div class="bar"><div id="homeNeed" class="fill"></div></div><span>ねむけ</span><div class="bar"><div id="sleepNeed" class="fill"></div></div></div><button id="mute">♪</button><div id="pad"><div class="empty"></div><button class="btn" data-k="up">▲</button><div class="empty"></div><button class="btn" data-k="left">◀</button><div class="empty"></div><button class="btn" data-k="right">▶</button><div class="empty"></div><button class="btn" data-k="down">▼</button><div class="empty"></div></div><button id="act">アクション</button></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=320,H=180,WW=1450,WH=920,T=16;const keys={up:0,down:0,left:0,right:0},keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};let muted=false,audio=null,lastStep=0,bgmTimer=null,raining=false,weatherT=18+Math.random()*22,randomTalkT=8+Math.random()*10,itemSpawnT=10+Math.random()*12;function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();startBgm()}if(audio.state==='suspended')audio.resume()}function beep(f=440,d=.05,type='square',v=.03){if(muted)return;ensureAudio();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function startBgm(){let i=0,n=[523,659,784,659,587,698,880,698,523,659,698,587];bgmTimer=setInterval(()=>{if(audio&&!muted)beep(n[i++%n.length],.08,'square',.01)},330)}mute.onclick=()=>{muted=!muted;mute.textContent=muted?'×':'♪';ensureAudio()};addEventListener('keydown',e=>{ensureAudio();if(keyMap[e.code]){keys[keyMap[e.code]]=1;e.preventDefault()}if(e.code==='Space'){interact();e.preventDefault()}});addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=0});document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;const on=e=>{ensureAudio();keys[k]=1;e.preventDefault()},off=e=>{keys[k]=0;e.preventDefault()};b.onpointerdown=on;b.onpointerup=b.onpointercancel=b.onpointerleave=off});act.onpointerdown=e=>{ensureAudio();interact();e.preventDefault()};function hash(x,y){let n=x*374761393+y*668265263;n=(n^(n>>13))*1274126177;return(n^(n>>16))>>>0}function rnd(x,y){return(hash(x,y)%10000)/10000}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function px(x,y,w=1,h=1,col='#fff'){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}const river={x:770,w:74},bridge={y:405,h:54},house={x:250,y:160,w:136,h:96,doorX:318,doorY:238},farm={x:1010,y:610,w:250,h:170};const rabbit={x:520,y:500,speed:47,dir:'down',walk:0,hunger:86,thirst:82,home:8,sleep:12,bubble:0,bubbleText:''},cam={x:rabbit.x-W/2,y:rabbit.y-H/2};const trees=[{x:115,y:145},{x:175,y:255},{x:455,y:135},{x:535,y:245},{x:1100,y:170},{x:1245,y:250},{x:1320,y:560},{x:1040,y:710},{x:420,y:730},{x:170,y:690},{x:610,y:680},{x:1180,y:800}],rocks=[{x:470,y:350},{x:650,y:250},{x:1110,y:350},{x:1210,y:610},{x:555,y:805},{x:260,y:530},{x:965,y:770}],foods=[{x:460,y:470,e:0},{x:610,y:590,e:0},{x:1140,y:455,e:0},{x:1260,y:720,e:0},{x:350,y:735,e:0},{x:995,y:245,e:0}],sand=[{x:70,y:360,w:220,h:100},{x:1040,y:500,w:230,h:125},{x:920,y:90,w:250,h:85},{x:420,y:790,w:250,h:80}];const npcs=[{x:930,y:300,dx:1,dy:.3,c:'#d9c4aa',t:0,txt:''},{x:1180,y:430,dx:-.6,dy:.7,c:'#b8c9d9',t:0,txt:''},{x:520,y:760,dx:.7,dy:-.5,c:'#e1b8b8',t:0,txt:''}];const items=[];const lines=['風がきもちいい','あの雲、にんじんみたい','橋の向こう行こうかな','今日は静かだな','草がふわふわ','雨のにおいがする','畑、育ってるかな','なんか落ちてないかな'];const npcLines=['こんにちは','雨ふるかな','畑いってきたよ','眠くなってきた','川の音すき','にんじん見つけた？'];function onBridge(x,y){return x>river.x-8&&x<river.x+river.w+8&&y>bridge.y&&y<bridge.y+bridge.h}function inRiver(x,y){return x>river.x&&x<river.x+river.w&&!onBridge(x,y)}function collides(x,y){if(inRiver(x,y))return true;if(x>house.x-6&&x<house.x+house.w+6&&y>house.y+35&&y<house.y+house.h+8)return true;for(const t of trees)if(Math.hypot(x-t.x,y-(t.y+10))<15)return true;for(const r of rocks)if(Math.hypot(x-r.x,y-r.y)<12)return true;return false}function nearHome(){return Math.hypot(rabbit.x-house.doorX,rabbit.y-house.doorY)<42}function nearWater(){let dx=Math.min(Math.abs(rabbit.x-river.x),Math.abs(rabbit.x-(river.x+river.w)));return dx<25&&!onBridge(rabbit.x,rabbit.y)}function say(s,t=2){rabbit.bubbleText=s;rabbit.bubble=t}function nearestFood(){let b=null,d=999;for(const f of foods)if(!f.e){let q=Math.hypot(rabbit.x-f.x,rabbit.y-f.y);if(q<d){d=q;b=f}}return{f:b,d}}function nearestItem(){let b=null,d=999;for(const i of items){let q=Math.hypot(rabbit.x-i.x,rabbit.y-i.y);if(q<d){d=q;b=i}}return{i:b,d}}function interact(){let it=nearestItem();if(it.i&&it.d<28){say('ひろった！ '+it.i.icon,2.2);items.splice(items.indexOf(it.i),1);beep(988,.06,'square',.045);return}let n=nearestFood();if(n.f&&n.d<30&&!n.f.e){n.f.e=1;rabbit.hunger=Math.min(100,rabbit.hunger+48);say('おいしい！ 🥕');beep(880,.07,'square',.05);setTimeout(()=>beep(1175,.08,'square',.04),70);return}if(nearWater()){rabbit.thirst=100;say('ごくごく… 💧');beep(660,.05,'sine',.035);setTimeout(()=>beep(880,.08,'sine',.03),80);return}if(nearHome()){if(rabbit.sleep>45){rabbit.sleep=0;rabbit.home=0;rabbit.hunger=Math.min(100,rabbit.hunger+5);rabbit.thirst=Math.min(100,rabbit.thirst+5);say('すやすや… 💤',3);beep(392,.18,'sine',.025)}else{rabbit.home=0;say('ただいま！ 🏠',2.3);beep(523,.06,'square',.04)}return}say('…')}function ground(){ctx.fillStyle='#7eb95d';ctx.fillRect(0,0,W,H);for(const s of sand){let x=s.x-cam.x,y=s.y-cam.y;ctx.fillStyle='#d8c27e';ctx.fillRect(x,y,s.w,s.h)}for(let ty=Math.floor(cam.y/T)-1;ty<Math.ceil((cam.y+H)/T)+1;ty++)for(let tx=Math.floor(cam.x/T)-1;tx<Math.ceil((cam.x+W)/T)+1;tx++){let x=tx*T-cam.x,y=ty*T-cam.y,r=rnd(tx,ty);if(r<.55){px(x+3+(hash(tx,ty)%8),y+8,1,4,'#5b9846');px(x+6,y+10,1,3,'#6aa650')}if(r>.90){px(x+7,y+6,1,1,'#ffe89d');px(x+6,y+7,3,1,'#f4d3d3')}}drawRiver();drawFarm()}function drawRiver(){let x=river.x-cam.x;ctx.fillStyle='#4f9fca';ctx.fillRect(x,-cam.y,river.w,WH);for(let yy=-20;yy<H+30;yy+=18){px(x+8,yy,18,2,'#7bc4e2');px(x+42,yy+9,22,2,'#75bad9')}let by=bridge.y-cam.y;px(x-8,by,river.w+16,bridge.h,'#9a6e45');for(let y=by+3;y<by+bridge.h;y+=8)px(x-5,y,river.w+10,4,'#c08b55')}function drawFarm(){let x=farm.x-cam.x,y=farm.y-cam.y;ctx.fillStyle='#8b603e';ctx.fillRect(x,y,farm.w,farm.h);for(let yy=12;yy<farm.h-8;yy+=24){ctx.fillStyle='#6f472d';ctx.fillRect(x+10,y+yy,farm.w-20,10);for(let xx=22;xx<farm.w-20;xx+=30){px(x+xx,y+yy-3,2,5,'#3e813e');px(x+xx-2,y+yy-1,6,3,'#58a34f');px(x+xx,y+yy+5,3,4,'#d66c35')}}ctx.strokeStyle='#d8b071';ctx.lineWidth=4;ctx.strokeRect(x-3,y-3,farm.w+6,farm.h+6)}function tree(t){let x=t.x-cam.x,y=t.y-cam.y;px(x-4,y+9,8,22,'#795236');px(x-18,y-10,36,26,'#417b43');px(x-12,y-18,26,18,'#4e8c4d');px(x-22,y,18,18,'#3f7540');px(x+7,y-2,17,19,'#4b8448')}function rock(r){let x=r.x-cam.x,y=r.y-cam.y;px(x-9,y-5,18,10,'#778178');px(x-6,y-8,11,3,'#9ca39a');px(x-7,y+5,14,2,'#5f6d64')}function drawHouse(){let x=house.x-cam.x,y=house.y-cam.y;px(x,y+24,house.w,68,'#d8c08d');px(x+8,y+35,120,51,'#ead8aa');px(x-8,y+15,152,14,'#8a5640');px(x+6,y+5,124,16,'#a7634a');px(x+54,y+52,28,34,'#78543d');px(x+18,y+45,24,20,'#98c5d4');px(x+96,y+45,24,20,'#98c5d4')}function food(f){if(f.e)return;let x=f.x-cam.x,y=f.y-cam.y;px(x,y-8,2,6,'#3f833f');px(x+2,y-7,3,2,'#519c4d');px(x-2,y-7,3,2,'#519c4d');px(x-2,y-2,6,10,'#e67b3d')}function item(i){let x=i.x-cam.x,y=i.y-cam.y;ctx.font='12px system-ui';ctx.fillText(i.icon,x-6,y+4)}function drawBunny(x,y,col='#f2e8da',dir='down',npc=false){let sx=x-cam.x,sy=y-cam.y;ctx.save();ctx.translate(Math.round(sx),Math.round(sy));ctx.fillStyle='#32452e55';ctx.fillRect(-7,8,14,3);px(-4,-14,3,8,col);px(3,-15,3,9,col);px(-6,-8,12,10,col);px(-7,-6,2,6,col);px(5,-6,2,6,col);px(-6,-1,12,9,col);px(-5,5,10,4,col);if(dir==='down'){px(-3,-5,1,1,'#4b403b');px(3,-5,1,1,'#4b403b')}else if(dir==='left')px(-5,-5,1,1,'#4b403b');else if(dir==='right')px(5,-5,1,1,'#4b403b');ctx.restore();if(!npc)drawBubble(sx,sy)}function bubble(text,x,y){if(!text)return;ctx.save();ctx.font='9px system-ui';let tw=ctx.measureText(text).width+12,bx=clamp(x-tw/2,3,W-tw-3),by=y-40;ctx.fillStyle='#fff';ctx.fillRect(bx,by,tw,18);ctx.fillRect(x-2,by+17,6,5);ctx.fillStyle='#3d443e';ctx.fillText(text,bx+6,by+12);ctx.restore()}function thought(){if(rabbit.bubble>0)return rabbit.bubbleText;if(rabbit.sleep>78)return'ねむい… 💤';if(rabbit.thirst<30)return'のどかわいた… 💧';if(rabbit.hunger<30)return'おなかすいた… 🥕';if(rabbit.home>72)return'おうちに帰りたい… 🏠';return''}function drawBubble(x,y){bubble(thought(),x,y)}function rain(){if(!raining)return;ctx.fillStyle='#7ea2b529';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b9d8e8';ctx.lineWidth=1;for(let i=0;i<45;i++){let x=(i*47+performance.now()*.18)%W,y=(i*73+performance.now()*.32)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+7);ctx.stroke()}}function update(dt){rabbit.hunger=Math.max(0,rabbit.hunger-dt*.55);rabbit.thirst=Math.max(0,rabbit.thirst-dt*(raining?.45:.82));rabbit.home=Math.min(100,rabbit.home+dt*.38);rabbit.sleep=Math.min(100,rabbit.sleep+dt*.34);rabbit.bubble=Math.max(0,rabbit.bubble-dt);hunger.style.width=rabbit.hunger+'%';thirst.style.width=rabbit.thirst+'%';homeNeed.style.width=rabbit.home+'%';sleepNeed.style.width=rabbit.sleep+'%';let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=rabbit.x+dx*rabbit.speed*dt,ny=rabbit.y+dy*rabbit.speed*dt;if(!collides(nx,rabbit.y))rabbit.x=nx;if(!collides(rabbit.x,ny))rabbit.y=ny;rabbit.walk+=dt;if(Math.abs(dx)>Math.abs(dy))rabbit.dir=dx<0?'left':'right';else rabbit.dir=dy<0?'up':'down';if(performance.now()-lastStep>235){lastStep=performance.now();beep(260+((Math.floor(rabbit.walk*8)%2)*45),.025,'square',.012)}}for(const n of npcs){n.x+=n.dx*18*dt;n.y+=n.dy*18*dt;if(n.x<40||n.x>WW-40||inRiver(n.x,n.y)||collides(n.x,n.y)){n.dx*=-1;n.dy*=-1}if(Math.random()<dt*.18){n.dx=Math.cos(Math.random()*6.28);n.dy=Math.sin(Math.random()*6.28)}n.t=Math.max(0,n.t-dt)}weatherT-=dt;if(weatherT<0){raining=!raining;weatherT=raining?18+Math.random()*24:25+Math.random()*35;say(raining?'雨だ… ☔':'雨やんだ',1.8)}randomTalkT-=dt;if(randomTalkT<0&&rabbit.bubble<=0){say(lines[Math.floor(Math.random()*lines.length)],2.4);let n=npcs[Math.floor(Math.random()*npcs.length)];n.txt=npcLines[Math.floor(Math.random()*npcLines.length)];n.t=2.5;randomTalkT=9+Math.random()*14}itemSpawnT-=dt;if(itemSpawnT<0&&items.length<6){let icons=['🍀','🌼','🪨','🍎','🌰','⭐'],x=80+Math.random()*(WW-160),y=80+Math.random()*(WH-160);if(!inRiver(x,y)&&!collides(x,y))items.push({x,y,icon:icons[Math.floor(Math.random()*icons.length)]});itemSpawnT=12+Math.random()*18}let tx=rabbit.x-W/2,ty=rabbit.y-H/2;cam.x+=(tx-cam.x)*Math.min(1,dt*4.5);cam.y+=(ty-cam.y)*Math.min(1,dt*4.5);cam.x=clamp(cam.x,0,WW-W);cam.y=clamp(cam.y,0,WH-H)}function draw(){ground();drawHouse();for(const t of trees)tree(t);for(const r of rocks)rock(r);for(const f of foods)food(f);for(const i of items)item(i);for(const n of npcs){drawBunny(n.x,n.y,n.c,n.dx<-.2?'left':n.dx>.2?'right':'down',true);if(n.t>0)bubble(n.txt,n.x-cam.x,n.y-cam.y)}drawBunny(rabbit.x,rabbit.y);rain()}let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>

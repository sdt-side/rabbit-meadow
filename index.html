<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Rabbit Meadow</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#1f2d20;
    overflow:hidden;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  body{
    display:grid;
    place-items:center;
    touch-action:none;
  }
  #wrap{
    position:relative;
    width:min(100vw,960px);
    aspect-ratio:16/9;
    max-height:100vh;
  }
  canvas{
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#7db85b;
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 18px 60px rgba(0,0,0,.35);
  }
  #hint{
    position:absolute;
    left:12px;
    top:10px;
    color:rgba(255,255,255,.75);
    font-size:12px;
    letter-spacing:.04em;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
    pointer-events:none;
  }
  #pad{
    position:absolute;
    left:14px;
    bottom:14px;
    width:118px;
    height:118px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:4px;
    opacity:.6;
  }
  .btn{
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:18px;
    user-select:none;
    -webkit-user-select:none;
  }
  .btn:active{background:rgba(255,255,255,.34)}
  .empty{visibility:hidden}
  @media (hover:hover) and (pointer:fine){
    #pad{opacity:.22}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="hint">矢印 / WASD / 左下パッドで移動</div>
  <div id="pad" aria-label="movement controls">
    <div class="empty"></div><button class="btn" data-k="up">▲</button><div class="empty"></div>
    <button class="btn" data-k="left">◀</button><div class="empty"></div><button class="btn" data-k="right">▶</button>
    <div class="empty"></div><button class="btn" data-k="down">▼</button><div class="empty"></div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = canvas.width, H = canvas.height;
const WORLD_W = 1400, WORLD_H = 900;
const TILE = 16;

const keys = {up:false,down:false,left:false,right:false};
const keyMap = {
  ArrowUp:"up", KeyW:"up",
  ArrowDown:"down", KeyS:"down",
  ArrowLeft:"left", KeyA:"left",
  ArrowRight:"right", KeyD:"right"
};

addEventListener("keydown", e=>{
  const k = keyMap[e.code];
  if(k){ keys[k]=true; e.preventDefault(); }
});
addEventListener("keyup", e=>{
  const k = keyMap[e.code];
  if(k){ keys[k]=false; e.preventDefault(); }
});

document.querySelectorAll(".btn").forEach(btn=>{
  const k = btn.dataset.k;
  const on = e=>{ keys[k]=true; e.preventDefault(); };
  const off = e=>{ keys[k]=false; e.preventDefault(); };
  btn.addEventListener("pointerdown", on);
  btn.addEventListener("pointerup", off);
  btn.addEventListener("pointercancel", off);
  btn.addEventListener("pointerleave", off);
});

function hash(x,y){
  let n = x*374761393 + y*668265263;
  n = (n ^ (n >> 13)) * 1274126177;
  return (n ^ (n >> 16)) >>> 0;
}
function rand2(x,y){ return (hash(x,y)%10000)/10000; }

const rabbit = {
  x: WORLD_W/2,
  y: WORLD_H/2,
  vx:0, vy:0,
  speed:44,
  dir:"down",
  walkT:0,
  idle:0,
  earT:0
};
const cam = {x:rabbit.x-W/2, y:rabbit.y-H/2};
const bentGrass = new Map();

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function px(x,y,w=1,h=1,c="#fff"){
  ctx.fillStyle=c;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function drawGround(){
  const sx = Math.floor(cam.x/TILE)-1;
  const sy = Math.floor(cam.y/TILE)-1;
  const ex = Math.ceil((cam.x+W)/TILE)+1;
  const ey = Math.ceil((cam.y+H)/TILE)+1;

  ctx.fillStyle="#7fb85c";
  ctx.fillRect(0,0,W,H);

  for(let ty=sy; ty<=ey; ty++){
    for(let tx=sx; tx<=ex; tx++){
      const wx = tx*TILE, wy = ty*TILE;
      const x = Math.floor(wx-cam.x), y = Math.floor(wy-cam.y);
      const r = rand2(tx,ty);

      if(r < .55){
        px(x+3+(hash(tx,ty)%8), y+8, 1, 4, "#5c9848");
        px(x+5+(hash(tx+3,ty)%5), y+10, 1, 3, "#6aa54f");
      }
      if(r > .87){
        px(x+7,y+6,1,1,"#f6e9a3");
        px(x+6,y+7,3,1,"#f2d9d0");
        px(x+7,y+8,1,1,"#f6e9a3");
      } else if(r > .80){
        px(x+11,y+11,2,1,"#bcd9ff");
        px(x+12,y+10,1,3,"#e9f0ff");
      }

      const key = tx+","+ty;
      const bend = bentGrass.get(key);
      if(bend){
        const age = performance.now()-bend;
        if(age < 650){
          const q = 1-age/650;
          px(x+8, y+11, 3, 1, "#4d8a3d");
          px(x+9, y+10, 3, 1, q>.4 ? "#5a9846" : "#6aa54f");
        } else bentGrass.delete(key);
      }
    }
  }

  for(let i=0;i<26;i++){
    const wx = (i*173)%WORLD_W;
    const wy = (i*281)%WORLD_H;
    const dx = wx-cam.x, dy = wy-cam.y;
    if(dx>-20&&dy>-20&&dx<W+20&&dy<H+20){
      ctx.fillStyle="rgba(111,135,75,.28)";
      ctx.fillRect(Math.round(dx),Math.round(dy),8+(i%3)*5,3+(i%2)*2);
    }
  }
}

function drawRabbit(x,y,dir,walking,earKick){
  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));

  const hop = walking ? (Math.sin(rabbit.walkT*10)>0 ? 0 : 1) : 0;
  ctx.translate(0,-hop);

  ctx.fillStyle="rgba(49,72,42,.28)";
  ctx.fillRect(-7,8,14,3);
  ctx.fillRect(-5,7,10,1);

  const fur="#f1e7d8", shade="#d8c9b7", pink="#d99ea8", dark="#4a403a";

  let e1=-4, e2=3;
  if(earKick) e2=1;
  px(e1,-14,3,8,fur); px(e1+1,-13,1,5,pink);
  px(e2,-15,3,9,fur); px(e2+1,-14,1,6,pink);

  px(-6,-1,12,9,fur);
  px(-5,5,10,4,fur);
  px(-7,1,2,5,shade);
  px(5,2,2,5,shade);

  px(-6,-8,12,10,fur);
  px(-5,-9,10,2,fur);
  px(-7,-6,2,6,fur);
  px(5,-6,2,6,fur);

  const step = walking ? (Math.floor(rabbit.walkT*8)%2) : 0;
  if(step===0){
    px(-6,8,5,2,shade); px(2,8,5,2,shade);
  }else{
    px(-7,8,5,2,shade); px(3,8,5,2,shade);
  }

  if(dir==="down"){
    px(-3,-5,1,1,dark); px(3,-5,1,1,dark);
    px(0,-2,1,1,pink);
    px(-1,0,1,1,dark); px(1,0,1,1,dark);
  }else if(dir==="up"){
    px(-4,-6,2,1,shade); px(3,-6,2,1,shade);
  }else if(dir==="left"){
    px(-5,-5,1,1,dark); px(-6,-2,1,1,pink);
    px(4,4,2,2,fur);
  }else{
    px(5,-5,1,1,dark); px(6,-2,1,1,pink);
    px(-6,4,2,2,fur);
  }
  ctx.restore();
}

function update(dt){
  let dx=(keys.right?1:0)-(keys.left?1:0);
  let dy=(keys.down?1:0)-(keys.up?1:0);
  const moving = dx!==0 || dy!==0;

  if(moving){
    const len=Math.hypot(dx,dy)||1;
    dx/=len; dy/=len;
    rabbit.x += dx*rabbit.speed*dt;
    rabbit.y += dy*rabbit.speed*dt;
    rabbit.walkT += dt;
    rabbit.idle=0;

    if(Math.abs(dx)>Math.abs(dy)) rabbit.dir=dx<0?"left":"right";
    else rabbit.dir=dy<0?"up":"down";

    const tx=Math.floor(rabbit.x/TILE), ty=Math.floor((rabbit.y+7)/TILE);
    bentGrass.set(tx+","+ty, performance.now());
  }else{
    rabbit.idle += dt;
    if(rabbit.idle>3.5){
      rabbit.earT += dt;
      if(rabbit.earT>2.2) rabbit.earT=0;
    }else rabbit.earT=0;
  }

  rabbit.x=clamp(rabbit.x,10,WORLD_W-10);
  rabbit.y=clamp(rabbit.y,16,WORLD_H-10);

  const tx=rabbit.x-W/2, ty=rabbit.y-H/2;
  cam.x += (tx-cam.x)*Math.min(1,dt*4.5);
  cam.y += (ty-cam.y)*Math.min(1,dt*4.5);
  cam.x=clamp(cam.x,0,WORLD_W-W);
  cam.y=clamp(cam.y,0,WORLD_H-H);
}

function draw(){
  drawGround();

  for(let i=0;i<18;i++){
    const wx=(90+i*263)%WORLD_W;
    const wy=(140+i*197)%WORLD_H;
    const x=wx-cam.x,y=wy-cam.y;
    if(x>-10&&y>-10&&x<W+10&&y<H+10){
      px(x,y,5,2,"#7e8c71");
      px(x+1,y-1,3,1,"#a7b09b");
    }
  }

  const sx=rabbit.x-cam.x, sy=rabbit.y-cam.y;
  const walking=keys.up||keys.down||keys.left||keys.right;
  const earKick=rabbit.idle>3.5 && rabbit.earT<.22;
  drawRabbit(sx,sy,rabbit.dir,walking,earKick);

  ctx.fillStyle="rgba(255,246,208,.04)";
  ctx.fillRect(0,0,W,H);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

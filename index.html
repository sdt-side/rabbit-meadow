<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1f2d20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rabbit Meadow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>Rabbit Meadow</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f2d20;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100vh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;background:#7db85b}#hud{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));color:#fff;background:#263b2dcc;padding:5px 6px;border-radius:8px;font-size:9px;display:grid;grid-template-columns:auto 52px;gap:3px 5px}.bar{height:6px;background:#0005;border:1px solid #fff5}.fill{height:100%}#hunger{background:#ffd66b}#thirst{background:#6ec8ff}#homeNeed{background:#e4a7ff}#sleepNeed{background:#9bb7ff}#mute{position:absolute;right:max(8px,env(safe-area-inset-right));top:74px;border:0;background:#263b2dcc;color:#fff;border-radius:6px;padding:4px 7px}#pad{position:absolute;left:max(84px,calc(env(safe-area-inset-left) + 84px));bottom:max(12px,env(safe-area-inset-bottom));width:108px;height:108px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;opacity:.64}.btn,#act{border:0;border-radius:10px;background:#ffffff28;color:#fff;font-size:17px}.btn:active,#act:active{background:#ffffff55}.empty{visibility:hidden}#act{position:absolute;right:max(90px,calc(env(safe-area-inset-right) + 90px));bottom:max(26px,env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;font-size:0}@media(hover:hover) and (pointer:fine){#pad,#act{opacity:.28}}@media(orientation:portrait){#wrap{transform:rotate(90deg);width:100vh;height:100vw;position:absolute;left:50%;top:50%;margin-left:-50vh;margin-top:-50vw}}</style></head><body><div id="wrap"><canvas id="game" width="320" height="180"></canvas><div id="hud"><span>おなか</span><div class="bar"><div id="hunger" class="fill"></div></div><span>のど</span><div class="bar"><div id="thirst" class="fill"></div></div><span>おうち</span><div class="bar"><div id="homeNeed" class="fill"></div></div><span>ねむけ</span><div class="bar"><div id="sleepNeed" class="fill"></div></div></div><button id="mute">♪</button><div id="pad"><div class="empty"></div><button class="btn" data-k="up">▲</button><div class="empty"></div><button class="btn" data-k="left">◀</button><div class="empty"></div><button class="btn" data-k="right">▶</button><div class="empty"></div><button class="btn" data-k="down">▼</button><div class="empty"></div></div><button id="act" aria-label="アクション"></button></div><script>

const c=game,ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=320,H=180,WW=1450,WH=920,SWW=640,SWH=420,T=16;
const keys={up:0,down:0,left:0,right:0},km={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
let muted=false,audio,bgmOsc,sfxOsc,bgmTimer,lastStep=0,lastFoot=0,itemSpawnT=8,rareT=18,secret=false,rainbowT=0,whiteFlower=null,stranger=null,recentPlace='草原',homeArmed=true,trailSteps=0,trailFind=null,starEventT=0;
const SAVE='rabbit-meadow-state-v3';let saved={};try{saved=JSON.parse(localStorage.getItem(SAVE)||'{}')}catch(e){}let flowersAtHome=saved.flowersAtHome||0,homeReturns=saved.homeReturns||0,heldStars=saved.heldStars||0,starSecret=!!saved.starSecret,trailSecret=!!saved.trailSecret;
function save(){try{localStorage.setItem(SAVE,JSON.stringify({flowersAtHome,homeReturns,heldStars,starSecret,trailSecret,npcTalks:npcs.map(n=>n.talks),friends:npcs.map(n=>!!n.friend)}))}catch(e){}}
function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();let i=0,n=[523,659,784,659,587,698,880,698];bgmTimer=setInterval(()=>{if(muted)return;stop(bgmOsc);let o=audio.createOscillator(),g=audio.createGain();bgmOsc=o;o.type='square';o.frequency.value=n[i++%n.length];g.gain.setValueAtTime(.01,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.08);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.08)},330)}if(audio.state==='suspended')audio.resume()}function stop(o){try{o&&o.stop()}catch(e){}}function sfx(f=440,d=.06,type='square',v=.03){if(muted)return;ensureAudio();stop(sfxOsc);let o=audio.createOscillator(),g=audio.createGain();sfxOsc=o;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
mute.onclick=()=>{muted=!muted;mute.textContent=muted?'×':'♪';ensureAudio()};addEventListener('keydown',e=>{ensureAudio();if(km[e.code]){keys[km[e.code]]=1;e.preventDefault()}if(e.code==='Space'){interact();e.preventDefault()}});addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=0});document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{ensureAudio();keys[k]=1;e.preventDefault()};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{keys[k]=0;e.preventDefault()}});act.onpointerdown=e=>{ensureAudio();interact();e.preventDefault()};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function px(x,y,w=1,h=1,col='#fff'){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function hash(x,y){let n=x*374761393+y*668265263;n=(n^(n>>13))*1274126177;return(n^(n>>16))>>>0}function rnd(x,y){return(hash(x,y)%10000)/10000}
const river={x:770,w:74},bridge={y:405,h:54},house={x:250,y:160,w:136,h:96,doorX:318,doorY:238},farm={x:1010,y:610,w:250,h:170};const sand=[{x:70,y:360,w:220,h:100},{x:1040,y:500,w:230,h:125},{x:920,y:90,w:250,h:85},{x:420,y:790,w:250,h:80}],water=[{x:1045,y:340,r:43,type:'pond'},{x:1310,y:250,r:24,type:'well'},{x:930,y:560,r:24,type:'well'},{x:1370,y:690,r:24,type:'well'},{x:1160,y:120,r:24,type:'well'}],trees=[{x:115,y:145},{x:175,y:255},{x:455,y:135},{x:535,y:245},{x:1100,y:170},{x:1245,y:250},{x:1320,y:560},{x:1040,y:710},{x:420,y:730},{x:170,y:690},{x:610,y:680},{x:1180,y:800}],rocks=[{x:470,y:350},{x:650,y:250},{x:1110,y:350},{x:1210,y:610},{x:555,y:805},{x:260,y:530},{x:965,y:770}],foods=[{x:460,y:470,e:0},{x:610,y:590,e:0},{x:1140,y:455,e:0},{x:1260,y:720,e:0},{x:350,y:735,e:0},{x:995,y:245,e:0}],farmCarrots=[{x:1050,y:650,e:0},{x:1120,y:650,e:0},{x:1190,y:650,e:0},{x:1085,y:715,e:0},{x:1160,y:715,e:0},{x:1230,y:715,e:0}];
const rabbit={x:520,y:500,speed:47,dir:'down',walk:0,hunger:86,thirst:82,home:8,sleep:12,bubble:0,bubbleText:''},cam={x:360,y:410};const ts=saved.npcTalks||[],fs=saved.friends||[];const npcs=[{id:0,x:930,y:300,dx:1,dy:.3,c:'#d9c4aa',talks:ts[0]||0,friend:!!fs[0],dir:'right',walk:0,pause:0,cool:0},{id:1,x:1180,y:430,dx:-.6,dy:.7,c:'#b8c9d9',talks:ts[1]||0,friend:!!fs[1],dir:'left',walk:0,pause:0,cool:0},{id:2,x:520,y:760,dx:.7,dy:-.5,c:'#e1b8b8',talks:ts[2]||0,friend:!!fs[2],dir:'up',walk:0,pause:0,cool:0}],items=[],footprints=[];
function onBridge(x,y){return x>river.x-8&&x<river.x+river.w+8&&y>bridge.y&&y<bridge.y+bridge.h}function inRiver(x,y){return x>river.x&&x<river.x+river.w&&!onBridge(x,y)}function inSand(x,y){return !secret&&sand.some(s=>x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)}function onEastPath(x,y){return !secret&&x>845&&x<1415&&y>455&&y<485}function nonGrass(x,y){return inSand(x,y)||onBridge(x,y)||onEastPath(x,y)||(x>farm.x&&x<farm.x+farm.w&&y>farm.y&&y<farm.y+farm.h)||Math.hypot(x-house.doorX,y-(house.doorY+20))<55}
function collides(x,y){if(secret)return false;if(inRiver(x,y))return true;if(x>house.x-6&&x<house.x+house.w+6&&y>house.y+35&&y<house.y+house.h+8)return true;for(const t of trees)if(Math.hypot(x-t.x,y-(t.y+10))<15)return true;for(const w of water){let d=Math.hypot(x-w.x,y-w.y);if(w.type==='pond'&&d<w.r-5)return true;if(w.type==='well'&&d<18)return true}return false}
function zone(x,y){if(secret)return'秘密の花畑';if(Math.hypot(x-house.doorX,y-house.doorY)<120)return'家の近く';if(x>river.x+river.w)return'橋の向こう';if(x>farm.x-80&&y>farm.y-80)return'畑の近く';if(water.some(w=>Math.hypot(x-w.x,y-w.y)<100))return'井戸の近く';if(inSand(x,y))return'砂地';return'草原'}function nearHome(){return !secret&&Math.hypot(rabbit.x-house.doorX,rabbit.y-house.doorY)<42}function nearWater(){if(secret)return false;for(const w of water)if(Math.hypot(rabbit.x-w.x,rabbit.y-w.y)<w.r+22)return true;return Math.min(Math.abs(rabbit.x-river.x),Math.abs(rabbit.x-river.x-river.w))<25&&!onBridge(rabbit.x,rabbit.y)}
function say(s,t=2){rabbit.bubbleText=s;rabbit.bubble=t}function nearestItem(){let b=null,d=999;for(const i of items){let q=Math.hypot(rabbit.x-i.x,rabbit.y-i.y);if(q<d){d=q;b=i}}return{i:b,d}}function nearestFood(){let b=null,d=999;for(const f of foods)if(!f.e){let q=Math.hypot(rabbit.x-f.x,rabbit.y-f.y);if(q<d){d=q;b=f}}return{f:b,d}}function nearestCarrot(){let b=null,d=999;for(const f of farmCarrots)if(!f.e){let q=Math.hypot(rabbit.x-f.x,rabbit.y-f.y);if(q<d){d=q;b=f}}return{f:b,d}}function nearestNpc(){let b=null,d=999,bi=-1;npcs.forEach((n,i)=>{if(n.friend)return;let q=Math.hypot(rabbit.x-n.x,rabbit.y-n.y);if(q<d){d=q;b=n;bi=i}});if(stranger){let q=Math.hypot(rabbit.x-stranger.x,rabbit.y-stranger.y);if(q<d){d=q;b=stranger;bi=99}}return{n:b,d,i:bi}}
function friends(){return npcs.filter(n=>n.friend)}function memoryLine(n){if(n.talks<2)return['こんにちは','井戸の水つめたいよ','にんじん見つけた？'][n.id];if(recentPlace==='橋の向こう')return'さっき橋の向こうにいたよね';if(recentPlace==='家の近く')return'また家の近くにいたね';if(recentPlace==='井戸の近く')return'井戸のほう行ってた？';if(recentPlace==='畑の近く')return'畑、見てきたんだね';return['また会ったね','よく会うね','最近よく会うね'][n.id]}
function pickup(icon){if(icon==='🍎'){rabbit.hunger=Math.min(100,rabbit.hunger+42);say('りんご！ 🍎')}else if(icon==='🌰'){rabbit.hunger=Math.min(100,rabbit.hunger+18);say('どんぐり 🌰')}else if(icon==='🌱'){rabbit.hunger=Math.min(100,rabbit.hunger+10);say('やわらかい芽 🌱')}else if(icon==='🌼'){flowersAtHome=Math.min(24,flowersAtHome+1);say('家に飾ろう 🌼');save()}else if(icon==='🍀'){rabbit.home=Math.max(0,rabbit.home-18);say('落ち着く 🍀')}else if(icon==='⭐'){heldStars++;if(heldStars>=3&&!starSecret){starSecret=true;starEventT=10;sfx(1320,.18,'sine',.05)}say('⭐をひろった');save()}}
function useStar(){if(heldStars<1)return false;heldStars--;rabbit.hunger=100;rabbit.thirst=100;rabbit.home=0;rabbit.sleep=0;say('⭐ ぜんぶ元気！',2.8);sfx(1180,.15,'sine',.045);save();return true}
function interact(){let it=nearestItem();if(it.i&&it.d<28){items.splice(items.indexOf(it.i),1);pickup(it.i.icon);return}if(whiteFlower&&Math.hypot(rabbit.x-whiteFlower.x,rabbit.y-whiteFlower.y)<28){whiteFlower=null;flowersAtHome=Math.min(24,flowersAtHome+2);save();say('珍しい白い花！');return}if(trailFind&&Math.hypot(rabbit.x-trailFind.x,rabbit.y-trailFind.y)<28){trailFind=null;items.push({x:rabbit.x+18,y:rabbit.y,icon:'🌱'});trailSecret=true;save();say('……何かあった');return}let fc=nearestCarrot();if(!secret&&fc.f&&fc.d<30){fc.f.e=1;rabbit.hunger=Math.min(100,rabbit.hunger+34);say('畑のにんじん！ 🥕');return}let f=nearestFood();if(!secret&&f.f&&f.d<30){f.f.e=1;rabbit.hunger=Math.min(100,rabbit.hunger+48);say('おいしい！ 🥕');return}let nn=nearestNpc();if(nn.n&&nn.d<38){if(nn.i===99){say('見たことないうさぎだ…');return}let n=nn.n;n.talks++;say(memoryLine(n));if(n.talks>=3&&!n.friend&&friends().length<3){n.friend=true;say('友達になった',2.3)}save();return}if(nearWater()){rabbit.thirst=100;say('ごくごく… 💧');return}if(nearHome()){if(homeArmed){homeReturns++;homeArmed=false;save()}rabbit.home=0;if(rabbit.sleep>45){rabbit.sleep=0;say('すやすや… 💤',3)}else say('ただいま！ 🏠');return}if(starSecret&&secret&&Math.hypot(rabbit.x-SWW/2,rabbit.y-SWH/2)<38){starEventT=12;say('……',2);sfx(1568,.2,'sine',.04);return}if((rabbit.hunger<35||rabbit.thirst<35||rabbit.sleep>65||rabbit.home>65)&&useStar())return;say('…')}
function drawPath(){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#c9b47e';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(river.x-cam.x,432-cam.y);ctx.lineTo(665-cam.x,430-cam.y);ctx.lineTo(555-cam.x,380-cam.y);ctx.lineTo(455-cam.x,322-cam.y);ctx.lineTo(house.doorX-cam.x,house.doorY+20-cam.y);ctx.stroke();ctx.strokeStyle='#dbc98f';ctx.lineWidth=18;ctx.stroke();ctx.restore()}
function ground(){if(secret){ctx.fillStyle=starEventT>0?'#98cf78':'#91c96d';ctx.fillRect(0,0,W,H);for(let y=0;y<SWH;y+=24)for(let x=0;x<SWW;x+=24){let r=rnd(x,y),sx=x-cam.x,sy=y-cam.y;if(r>.45){px(sx+5,sy+7,2,2,'#fff');px(sx+3,sy+9,6,2,r>.8?'#f5ddff':'#fff3b6')}}if(starSecret){let x=SWW/2-cam.x,y=SWH/2-cam.y;for(let i=0;i<3;i++){let a=performance.now()/900+i*2.09;px(x+Math.cos(a)*18,y+Math.sin(a)*10,2,2,'#fff7b8')}}return}ctx.fillStyle='#7eb95d';ctx.fillRect(0,0,W,H);for(const s of sand){ctx.fillStyle='#d8c27e';ctx.fillRect(s.x-cam.x,s.y-cam.y,s.w,s.h)}for(let ty=Math.floor(cam.y/T)-1;ty<Math.ceil((cam.y+H)/T)+1;ty++)for(let tx=Math.floor(cam.x/T)-1;tx<Math.ceil((cam.x+W)/T)+1;tx++){let r=rnd(tx,ty),x=tx*T-cam.x,y=ty*T-cam.y;if(r<.55)px(x+4,y+8,1,4,'#5b9846')}drawPath();drawRiver();drawFarm();drawEast();drawFootprints()}
function drawRiver(){let x=river.x-cam.x;ctx.fillStyle='#4f9fca';ctx.fillRect(x,-cam.y,river.w,WH);let by=bridge.y-cam.y;px(x-8,by,river.w+16,bridge.h,'#9a6e45');for(let y=by+3;y<by+bridge.h;y+=8)px(x-5,y,river.w+10,4,'#c08b55')}
function drawFarm(){let x=farm.x-cam.x,y=farm.y-cam.y;ctx.fillStyle='#8b603e';ctx.fillRect(x,y,farm.w,farm.h);for(let yy=18;yy<farm.h-8;yy+=32){ctx.fillStyle='#6f472d';ctx.fillRect(x+10,y+yy,farm.w-20,8)}ctx.strokeStyle='#d8b071';ctx.lineWidth=4;ctx.strokeRect(x-3,y-3,farm.w+6,farm.h+6);for(const f of farmCarrots)if(!f.e){let fx=f.x-cam.x,fy=f.y-cam.y;px(fx,fy-8,2,6,'#3f833f');px(fx-2,fy-1,6,9,'#e67b3d')}}
function tree(t){let x=t.x-cam.x,y=t.y-cam.y;px(x-4,y+9,8,22,'#795236');px(x-18,y-10,36,26,'#417b43');px(x-12,y-18,26,18,'#4e8c4d')}function rock(r){let x=r.x-cam.x,y=r.y-cam.y;px(x-9,y-5,18,10,'#778178');px(x-6,y-8,11,3,'#9ca39a')}
function drawEast(){ctx.fillStyle='#c9b781';ctx.fillRect(845-cam.x,455-cam.y,570,30);for(const w of water){if(w.type==='pond'){let x=w.x-cam.x,y=w.y-cam.y;ctx.fillStyle='#3f8fba';ctx.beginPath();ctx.ellipse(x,y,50,35,0,0,Math.PI*2);ctx.fill()}else{let x=w.x-cam.x,y=w.y-cam.y;px(x-17,y-10,34,20,'#9a9b91');px(x-14,y-7,28,14,'#4f8ead');px(x-20,y-14,40,5,'#c2bda9')}}}
function drawHouse(){let x=house.x-cam.x,y=house.y-cam.y,wc=homeReturns>=6?'#b8a6d9':'#98c5d4';px(x,y+24,house.w,68,'#d8c08d');px(x+8,y+35,120,51,'#ead8aa');px(x-8,y+15,152,14,'#8a5640');px(x+6,y+5,124,16,'#a7634a');px(x+54,y+52,28,34,'#78543d');px(x+18,y+45,24,20,wc);px(x+96,y+45,24,20,wc);if(homeReturns>=9){px(x+127,y+60,9,26,'#654936');px(x+129,y+63,5,20,'#8a674c')}let pots=homeReturns>=3?1+Math.max(0,Math.floor((homeReturns-9)/3)):0;for(let i=0;i<pots;i++){let xx=x-12-i*13;px(xx,y+82,9,8,'#a76645');px(xx+2,y+75,1,7,'#4e8745')}for(let i=0;i<flowersAtHome;i++){let xx=x+12+(i%6)*20,yy=y+96+Math.floor(i/6)*9;px(xx,yy,1,4,'#4b8741');px(xx-2,yy-2,5,3,i%3===0?'#fff':'#f4d6e6')}}
function food(f){if(f.e)return;let x=f.x-cam.x,y=f.y-cam.y;px(x,y-8,2,6,'#3f833f');px(x-2,y-2,6,10,'#e67b3d')}function item(i){ctx.font='12px system-ui';ctx.fillText(i.icon,i.x-cam.x-6,i.y-cam.y+4)}
function drawRabbit(x,y,col,dir,walk=0,idle=false){let sx=x-cam.x,sy=y-cam.y,step=Math.floor(walk*10)%2,ear=idle&&Math.floor(performance.now()/550)%2?1:0,sh='#b9a998',pk='#db9da9',dk='#4b403b';ctx.save();ctx.translate(Math.round(sx),Math.round(sy));ctx.scale(.5,.5);ctx.fillStyle='#32452e55';ctx.fillRect(-7,9,14,3);if(dir==='down'){px(-4,-14+ear,3,8,col);px(3,-15,3,9,col);px(-6,-8,12,10,col);px(-6,-1,12,9,col);px(step?-6:-7,step?7:8,5,2,sh);px(step?3:2,step?8:7,5,2,sh);px(-3,-5,1,1,dk);px(3,-5,1,1,dk);px(0,-2,1,1,pk)}else if(dir==='up'){px(-5,-15,3,9,col);px(3,-15+ear,3,9,col);px(-7,-7,14,9,col);px(-7,-1,14,9,col);px(step?-6:-7,step?7:8,5,2,sh);px(step?3:2,step?8:7,5,2,sh)}else if(dir==='left'){px(-3,-15+ear,3,9,col);px(2,-12,3,7,col);px(-8,-7,12,9,col);px(-7,-1,13,9,col);px(step?-6:-8,step?6:8,5,2,sh);px(step?2:0,step?8:6,5,2,sh);px(-6,-5,1,1,dk);px(5,3,3,3,col)}else{px(1,-15+ear,3,9,col);px(-5,-12,3,7,col);px(-4,-7,12,9,col);px(-6,-1,13,9,col);px(step?-7:-5,step?8:6,5,2,sh);px(step?1:3,step?6:8,5,2,sh);px(6,-5,1,1,dk);px(-8,3,3,3,col)}ctx.restore()}
function bubble(text,x,y){if(!text)return;ctx.save();ctx.font='9px system-ui';let tw=ctx.measureText(text).width+12,bx=clamp(x-tw/2,3,W-tw-3),by=y-40;ctx.fillStyle='#fff';ctx.fillRect(bx,by,tw,18);ctx.fillStyle='#3d443e';ctx.fillText(text,bx+6,by+12);ctx.restore()}function thought(){if(rabbit.bubble>0)return rabbit.bubbleText;if(rabbit.sleep>78)return'ねむい… 💤';if(rabbit.thirst<30)return'のどかわいた… 💧';if(rabbit.hunger<30)return'おなかすいた… 🥕';if(rabbit.home>72)return'おうちに帰りたい… 🏠';return''}
function drawFootprints(){for(const f of footprints){ctx.globalAlpha=f.life/3;let x=f.x-cam.x,y=f.y-cam.y;if(f.special){px(x,y,2,2,'#7f6b4a');px(x-3,y+2,2,2,'#7f6b4a');px(x+3,y+2,2,2,'#7f6b4a')}else{px(x-2,y,2,3,'#8f7c58');px(x+2,y+2,2,3,'#8f7c58')}}ctx.globalAlpha=1;if(trailFind){let x=trailFind.x-cam.x,y=trailFind.y-cam.y;px(x,y,1,5,'#5c8e45');px(x-2,y-2,5,3,'#d6c58d')}}
function interestTarget(n){if(n.cool>0)return null;if(n.id===0){let cand=whiteFlower?[whiteFlower]:[];cand.push(...items.filter(i=>i.icon==='🌼'));let t=cand.find(p=>Math.hypot(n.x-p.x,n.y-p.y)<85);if(t)return t}if(n.id===1){let t=water.find(w=>w.type==='well'&&Math.hypot(n.x-w.x,n.y-w.y)<100);if(t)return t}if(n.id===2){let t=items.find(i=>i.icon==='🌱'&&Math.hypot(n.x-i.x,n.y-i.y)<90);if(t)return t;if(Math.hypot(n.x-(farm.x+farm.w/2),n.y-(farm.y+farm.h/2))<110)return{x:farm.x+farm.w/2,y:farm.y+farm.h/2}}return null}
function updateFriends(dt){let a=friends();a.forEach((n,i)=>{n.cool=Math.max(0,n.cool-dt);n.pause=Math.max(0,n.pause-dt);if(n.pause>0)return;let interest=interestTarget(n),leader=i?a[i-1]:rabbit,target;if(interest)target=interest;else{let ang=leader.dir==='left'?0:leader.dir==='right'?Math.PI:leader.dir==='up'?Math.PI/2:-Math.PI/2;target={x:leader.x+Math.cos(ang)*22,y:leader.y+Math.sin(ang)*22}}let dx=target.x-n.x,dy=target.y-n.y,d=Math.hypot(dx,dy);if(d>160){n.x=target.x;n.y=target.y}else if(d>7){n.x+=dx*Math.min(1,dt*4);n.y+=dy*Math.min(1,dt*4);n.walk+=dt;if(Math.abs(dx)>Math.abs(dy))n.dir=dx<0?'left':'right';else n.dir=dy<0?'up':'down'}else if(interest){n.pause=1.4+Math.random()*1.4;n.cool=9+Math.random()*8}})}
function rare(dt){rainbowT=Math.max(0,rainbowT-dt);starEventT=Math.max(0,starEventT-dt);rareT-=dt;if(rareT>0)return;rareT=18+Math.random()*20;let r=Math.random();if(r<.08&&!secret)rainbowT=10;else if(r<.14&&!whiteFlower)whiteFlower={x:120+Math.random()*1100,y:120+Math.random()*650};else if(r<.19&&!stranger&&!secret)stranger={x:900+Math.random()*400,y:150+Math.random()*600,dx:.45,dy:.25,c:'#eee6cf',dir:'down',walk:0}}
function enterSecret(){secret=true;rabbit.x=SWW/2;rabbit.y=SWH-28;cam.x=160;cam.y=SWH-H;friends().forEach((n,i)=>{n.x=rabbit.x-20*(i+1);n.y=rabbit.y+14*(i+1)});say('秘密の花畑…？',2.5)}function leaveSecret(){secret=false;rabbit.x=1240;rabbit.y=28;cam.x=1080;cam.y=0;friends().forEach((n,i)=>{n.x=rabbit.x-20*(i+1);n.y=rabbit.y+14*(i+1)})}
function update(dt){rabbit.hunger=Math.max(0,rabbit.hunger-dt*.55);rabbit.thirst=Math.max(0,rabbit.thirst-dt*.82);rabbit.home=Math.min(100,rabbit.home+dt*.38);rabbit.sleep=Math.min(100,rabbit.sleep+dt*.34);rabbit.bubble=Math.max(0,rabbit.bubble-dt);hunger.style.width=rabbit.hunger+'%';thirst.style.width=rabbit.thirst+'%';homeNeed.style.width=rabbit.home+'%';sleepNeed.style.width=rabbit.sleep+'%';if(!nearHome()&&Math.hypot(rabbit.x-house.doorX,rabbit.y-house.doorY)>75)homeArmed=true;footprints.forEach(f=>f.life-=dt);footprints.splice(0,footprints.findIndex?0:0);while(footprints.length&&footprints[0].life<=0)footprints.shift();rare(dt);let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=rabbit.x+dx*rabbit.speed*dt,ny=rabbit.y+dy*rabbit.speed*dt;if(!collides(nx,rabbit.y))rabbit.x=nx;if(!collides(rabbit.x,ny))rabbit.y=ny;rabbit.walk+=dt;rabbit.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');recentPlace=zone(rabbit.x,rabbit.y);if(nonGrass(rabbit.x,rabbit.y)&&performance.now()-lastFoot>260){lastFoot=performance.now();let special=!trailSecret&&rabbit.x>1080&&rabbit.x<1265&&rabbit.y>505&&rabbit.y<625;footprints.push({x:rabbit.x,y:rabbit.y+8,life:3,special});if(special){trailSteps++;if(trailSteps>=9&&!trailFind)trailFind={x:1260,y:585}}if(footprints.length>40)footprints.shift()}if(secret){if(rabbit.x<8)rabbit.x=SWW-8;else if(rabbit.x>SWW-8)rabbit.x=8;if(rabbit.y<8)rabbit.y=SWH-8;else if(rabbit.y>SWH-8){leaveSecret();return}}else{if(rabbit.y<8&&rabbit.x>1160&&rabbit.x<1320){enterSecret();return}let warp=false;if(rabbit.x<8){rabbit.x=WW-8;warp=true}else if(rabbit.x>WW-8){rabbit.x=8;warp=true}if(rabbit.y<8){rabbit.y=WH-8;warp=true}else if(rabbit.y>WH-8){rabbit.y=8;warp=true}if(warp)friends().forEach((n,i)=>{n.x=rabbit.x-20*(i+1);n.y=rabbit.y+14*(i+1)})}if(performance.now()-lastStep>235){lastStep=performance.now();sfx(260+((Math.floor(rabbit.walk*8)%2)*45),.025,'square',.012)}}for(const n of npcs){if(n.friend||secret)continue;let ox=n.x,oy=n.y,nx=n.x+n.dx*18*dt,ny=n.y+n.dy*18*dt;if(!collides(nx,ny)){n.x=nx;n.y=ny;n.walk+=dt}else{n.dx*=-1;n.dy*=-1}if(n.x<40||n.x>WW-40)n.dx*=-1;if(n.y<40||n.y>WH-40)n.dy*=-1;let mx=n.x-ox,my=n.y-oy;if(Math.abs(mx)>Math.abs(my))n.dir=mx<0?'left':'right';else if(Math.abs(my)>.01)n.dir=my<0?'up':'down';if(Math.random()<dt*.15){n.dx=Math.cos(Math.random()*6.28);n.dy=Math.sin(Math.random()*6.28)}}updateFriends(dt);if(stranger&&!secret){stranger.x+=stranger.dx*13*dt;stranger.y+=stranger.dy*13*dt;stranger.walk+=dt;stranger.dir=stranger.dx<0?'left':'right'}itemSpawnT-=dt;if(itemSpawnT<0&&items.length<6){let r=Math.random(),icon=r<.025?'⭐':r<.20?'🌼':r<.45?'🍎':r<.68?'🌰':r<.84?'🍀':'🌱',mw=secret?SWW:WW,mh=secret?SWH:WH,x=80+Math.random()*(mw-160),y=80+Math.random()*(mh-160);if(!collides(x,y))items.push({x,y,icon});itemSpawnT=12+Math.random()*18}let mw=secret?SWW:WW,mh=secret?SWH:WH,tx=rabbit.x-W/2,ty=rabbit.y-H/2;cam.x+=(tx-cam.x)*Math.min(1,dt*4.5);cam.y+=(ty-cam.y)*Math.min(1,dt*4.5);cam.x=clamp(cam.x,0,mw-W);cam.y=clamp(cam.y,0,mh-H)}
function drawRainbow(){if(rainbowT<=0||secret)return;ctx.save();ctx.globalAlpha=.35;ctx.lineWidth=5;['#ef8d8d','#f0c36f','#dbe779','#86d596','#80bde2','#b3a0dd'].forEach((col,i)=>{ctx.strokeStyle=col;ctx.beginPath();ctx.arc(160,168,135-i*6,Math.PI,Math.PI*2);ctx.stroke()});ctx.restore()}
function draw(){ground();if(!secret){drawHouse();trees.forEach(tree);rocks.forEach(rock);foods.forEach(food)}for(const n of npcs){if(secret&&!n.friend)continue;drawRabbit(n.x,n.y,n.c,n.dir,n.walk,false)}items.forEach(item);if(whiteFlower){let x=whiteFlower.x-cam.x,y=whiteFlower.y-cam.y;px(x,y,1,5,'#43833e');px(x-3,y-3,7,3,'#fff')}if(stranger&&!secret)drawRabbit(stranger.x,stranger.y,stranger.c,stranger.dir,stranger.walk,false);drawRainbow();drawRabbit(rabbit.x,rabbit.y,'#f2e8da',rabbit.dir,rabbit.walk,!(keys.up||keys.down||keys.left||keys.right));bubble(thought(),rabbit.x-cam.x,rabbit.y-cam.y)}let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

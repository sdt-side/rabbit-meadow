<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#1f2d20" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rabbit Meadow" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Rabbit Meadow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f2d20;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:#1f2d20}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#7db85b}#hud{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));color:#fff;background:#263b2dcc;padding:5px 6px;border-radius:8px;font-size:9px;display:grid;grid-template-columns:auto 52px;gap:3px 5px;align-items:center}.bar{height:6px;background:#0005;border:1px solid #fff5}.fill{height:100%}#hunger{background:#ffd66b}#thirst{background:#6ec8ff}#homeNeed{background:#e4a7ff}#mute{position:absolute;right:max(8px,env(safe-area-inset-right));top:60px;border:0;background:#263b2dcc;color:#fff;border-radius:6px;padding:4px 7px}#pad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:108px;height:108px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;opacity:.64}.btn,#act{border:0;border-radius:10px;background:#ffffff28;color:#fff;font-size:17px;user-select:none;-webkit-user-select:none}.btn:active,#act:active{background:#ffffff55}.empty{visibility:hidden}#act{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;font-size:10px}@media(hover:hover) and (pointer:fine){#pad,#act{opacity:.28}}@media(orientation:portrait){#wrap{transform:rotate(90deg);width:100vh;height:100vw;position:absolute;left:50%;top:50%;margin-left:-50vh;margin-top:-50vw}}
</style>
</head><body><div id="wrap">
<canvas id="game" width="320" height="180"></canvas>
<div id="hud"><span>おなか</span><div class="bar"><div id="hunger" class="fill"></div></div><span>のど</span><div class="bar"><div id="thirst" class="fill"></div></div><span>おうち</span><div class="bar"><div id="homeNeed" class="fill"></div></div></div>
<button id="mute">♪</button>
<div id="pad"><div class="empty"></div><button class="btn" data-k="up">▲</button><div class="empty"></div><button class="btn" data-k="left">◀</button><div class="empty"></div><button class="btn" data-k="right">▶</button><div class="empty"></div><button class="btn" data-k="down">▼</button><div class="empty"></div></div>
<button id="act">アクション</button>
</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=320,H=180,WW=1450,WH=920,T=16;
const keys={up:0,down:0,left:0,right:0};const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
let muted=false,audio=null,lastStep=0,bgmTimer=null;
function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();startBgm()}if(audio.state==='suspended')audio.resume()}
function beep(freq=440,d=.05,type='square',vol=.03){if(muted)return;ensureAudio();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function startBgm(){let i=0,notes=[523,659,784,659,587,698,880,698,523,659,698,587];bgmTimer=setInterval(()=>{if(audio&&!muted)beep(notes[i++%notes.length],.08,'square',.01)},330)}
document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'×':'♪';ensureAudio()};
addEventListener('keydown',e=>{ensureAudio();if(keyMap[e.code]){keys[keyMap[e.code]]=1;e.preventDefault()}if(e.code==='Space'){interact();e.preventDefault()}});addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=0});
document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;const on=e=>{ensureAudio();keys[k]=1;e.preventDefault()},off=e=>{keys[k]=0;e.preventDefault()};b.onpointerdown=on;b.onpointerup=b.onpointercancel=b.onpointerleave=off});document.getElementById('act').onpointerdown=e=>{ensureAudio();interact();e.preventDefault()};
function hash(x,y){let n=x*374761393+y*668265263;n=(n^(n>>13))*1274126177;return(n^(n>>16))>>>0}function rnd(x,y){return(hash(x,y)%10000)/10000}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function px(x,y,w=1,h=1,col='#fff'){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
const river={x:770,w:74};const bridge={y:405,h:54};const house={x:250,y:160,w:136,h:96,doorX:318,doorY:238};
const rabbit={x:520,y:500,speed:47,dir:'down',walk:0,idle:0,hunger:86,thirst:82,home:8,bubble:0,bubbleText:''};const cam={x:rabbit.x-W/2,y:rabbit.y-H/2};
const trees=[{x:115,y:145},{x:175,y:255},{x:455,y:135},{x:535,y:245},{x:1100,y:170},{x:1245,y:250},{x:1320,y:560},{x:1040,y:710},{x:420,y:730},{x:170,y:690},{x:610,y:680},{x:1180,y:800}];
const rocks=[{x:470,y:350},{x:650,y:250},{x:1110,y:350},{x:1210,y:610},{x:555,y:805},{x:260,y:530},{x:965,y:770}];
const foods=[{x:460,y:470,eaten:false},{x:610,y:590,eaten:false},{x:1140,y:455,eaten:false},{x:1260,y:720,eaten:false},{x:350,y:735,eaten:false},{x:995,y:245,eaten:false}];
const sandPatches=[{x:70,y:360,w:220,h:100},{x:1040,y:500,w:230,h:125},{x:920,y:90,w:250,h:85},{x:420,y:790,w:250,h:80}];
function onBridge(x,y){return x>river.x-8&&x<river.x+river.w+8&&y>bridge.y&&y<bridge.y+bridge.h}function inRiver(x,y){return x>river.x&&x<river.x+river.w&&!onBridge(x,y)}
function collides(x,y){if(inRiver(x,y))return true;if(x>house.x-6&&x<house.x+house.w+6&&y>house.y+35&&y<house.y+house.h+8)return true;for(const t of trees)if(Math.hypot(x-t.x,y-(t.y+10))<15)return true;for(const r of rocks)if(Math.hypot(x-r.x,y-r.y)<12)return true;return false}
function nearestFood(){let best=null,bd=999;for(const f of foods)if(!f.eaten){let d=Math.hypot(rabbit.x-f.x,rabbit.y-f.y);if(d<bd){bd=d;best=f}}return{f:best,d:bd}}function nearWater(){let dx=Math.min(Math.abs(rabbit.x-river.x),Math.abs(rabbit.x-(river.x+river.w)));return dx<25&&!onBridge(rabbit.x,rabbit.y)}function nearHome(){return Math.hypot(rabbit.x-house.doorX,rabbit.y-house.doorY)<42}function say(text,t=2){rabbit.bubbleText=text;rabbit.bubble=t}
function interact(){let n=nearestFood();if(n.f&&n.d<30&&!n.f.eaten){n.f.eaten=true;rabbit.hunger=Math.min(100,rabbit.hunger+48);say('おいしい！ 🥕');beep(880,.07,'square',.05);setTimeout(()=>beep(1175,.08,'square',.04),70);return}if(nearWater()){rabbit.thirst=100;say('ごくごく… 💧');beep(660,.05,'sine',.035);setTimeout(()=>beep(880,.08,'sine',.03),80);return}if(nearHome()){rabbit.home=0;rabbit.hunger=Math.min(100,rabbit.hunger+8);rabbit.thirst=Math.min(100,rabbit.thirst+12);say('ただいま！ 🏠',2.6);beep(523,.06,'square',.04);setTimeout(()=>beep(784,.11,'square',.035),80);return}say('…');beep(180,.05,'square',.015)}
function ground(){ctx.fillStyle='#7eb95d';ctx.fillRect(0,0,W,H);for(const s of sandPatches){let x=s.x-cam.x,y=s.y-cam.y;ctx.fillStyle='#d8c27e';ctx.fillRect(x,y,s.w,s.h);ctx.fillStyle='#c9b26d';for(let i=0;i<22;i++){let qx=x+((i*37)%s.w),qy=y+((i*23)%s.h);ctx.fillRect(qx,qy,2,1)}}let sx=Math.floor(cam.x/T)-1,sy=Math.floor(cam.y/T)-1,ex=Math.ceil((cam.x+W)/T)+1,ey=Math.ceil((cam.y+H)/T)+1;for(let ty=sy;ty<=ey;ty++)for(let tx=sx;tx<=ex;tx++){let x=tx*T-cam.x,y=ty*T-cam.y,r=rnd(tx,ty);if(r<.56){px(x+3+(hash(tx,ty)%8),y+8,1,4,'#5b9846');px(x+6,y+10,1,3,'#6aa650')}if(r>.90){px(x+7,y+6,1,1,'#ffe89d');px(x+6,y+7,3,1,'#f4d3d3')}}drawRiver()}
function drawRiver(){let x=river.x-cam.x;ctx.fillStyle='#4f9fca';ctx.fillRect(x,-cam.y,river.w,WH);for(let yy=-20;yy<H+30;yy+=18){px(x+8,yy,18,2,'#7bc4e2');px(x+42,yy+9,22,2,'#75bad9')}let by=bridge.y-cam.y;px(x-8,by,river.w+16,bridge.h,'#9a6e45');for(let y=by+3;y<by+bridge.h;y+=8)px(x-5,y,river.w+10,4,'#c08b55');px(x-9,by-3,5,bridge.h+6,'#704d35');px(x+river.w+4,by-3,5,bridge.h+6,'#704d35')}
function tree(t){let x=t.x-cam.x,y=t.y-cam.y;px(x-4,y+9,8,22,'#795236');px(x-18,y-10,36,26,'#417b43');px(x-12,y-18,26,18,'#4e8c4d');px(x-22,y,18,18,'#3f7540');px(x+7,y-2,17,19,'#4b8448');px(x-8,y-8,4,3,'#78a85d')}
function rock(r){let x=r.x-cam.x,y=r.y-cam.y;px(x-9,y-5,18,10,'#778178');px(x-6,y-8,11,3,'#9ca39a');px(x-7,y+5,14,2,'#5f6d64')}
function drawHouse(){let x=house.x-cam.x,y=house.y-cam.y;px(x,y+24,house.w,68,'#d8c08d');px(x+8,y+35,120,51,'#ead8aa');px(x-8,y+15,152,14,'#8a5640');px(x+6,y+5,124,16,'#a7634a');px(x+54,y+52,28,34,'#78543d');px(x+18,y+45,24,20,'#98c5d4');px(x+96,y+45,24,20,'#98c5d4');px(x+66,y+66,4,4,'#d4b057')}
function food(f){if(f.eaten)return;let x=f.x-cam.x,y=f.y-cam.y;px(x,y-8,2,6,'#3f833f');px(x+2,y-7,3,2,'#519c4d');px(x-2,y-7,3,2,'#519c4d');px(x-2,y-2,6,10,'#e67b3d');px(x-1,y+8,4,2,'#c55d32')}
function bunny(){let x=rabbit.x-cam.x,y=rabbit.y-cam.y,move=keys.up||keys.down||keys.left||keys.right,hop=move&&Math.sin(rabbit.walk*11)>0?0:1;ctx.save();ctx.translate(Math.round(x),Math.round(y-hop));ctx.fillStyle='#32452e55';ctx.fillRect(-7,8,14,3);let fur='#f2e8da',sh='#d9cbbb',pk='#db9da9',dk='#4b403b';px(-4,-14,3,8,fur);px(-3,-13,1,5,pk);px(3,-15,3,9,fur);px(4,-14,1,6,pk);px(-6,-8,12,10,fur);px(-7,-6,2,6,fur);px(5,-6,2,6,fur);px(-6,-1,12,9,fur);px(-5,5,10,4,fur);px(-6,8,5,2,sh);px(2,8,5,2,sh);if(rabbit.dir==='down'){px(-3,-5,1,1,dk);px(3,-5,1,1,dk);px(0,-2,1,1,pk)}else if(rabbit.dir==='left'){px(-5,-5,1,1,dk);px(4,4,2,2,fur)}else if(rabbit.dir==='right'){px(5,-5,1,1,dk);px(-6,4,2,2,fur)}ctx.restore();drawBubble(x,y)}
function thoughtText(){if(rabbit.bubble>0)return rabbit.bubbleText;if(rabbit.thirst<30)return 'のどかわいた… 💧';if(rabbit.hunger<30)return 'おなかすいた… 🥕';if(rabbit.home>72)return 'おうちに帰りたい… 🏠';return ''}function drawBubble(x,y){let text=thoughtText();if(!text)return;ctx.save();ctx.font='9px system-ui';let tw=ctx.measureText(text).width+12,bx=clamp(x-tw/2,3,W-tw-3),by=y-40;ctx.fillStyle='#fff';ctx.fillRect(bx,by,tw,18);ctx.fillRect(x-2,by+17,6,5);ctx.fillStyle='#3d443e';ctx.fillText(text,bx+6,by+12);ctx.restore()}
function update(dt){rabbit.hunger=Math.max(0,rabbit.hunger-dt*.55);rabbit.thirst=Math.max(0,rabbit.thirst-dt*.82);rabbit.home=Math.min(100,rabbit.home+dt*.38);rabbit.bubble=Math.max(0,rabbit.bubble-dt);document.getElementById('hunger').style.width=rabbit.hunger+'%';document.getElementById('thirst').style.width=rabbit.thirst+'%';document.getElementById('homeNeed').style.width=rabbit.home+'%';let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),moving=dx||dy;if(moving){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=rabbit.x+dx*rabbit.speed*dt,ny=rabbit.y+dy*rabbit.speed*dt;if(!collides(nx,rabbit.y))rabbit.x=nx;if(!collides(rabbit.x,ny))rabbit.y=ny;rabbit.walk+=dt;rabbit.idle=0;if(Math.abs(dx)>Math.abs(dy))rabbit.dir=dx<0?'left':'right';else rabbit.dir=dy<0?'up':'down';if(performance.now()-lastStep>235){lastStep=performance.now();beep(260+((Math.floor(rabbit.walk*8)%2)*45),.025,'square',.012)}}else rabbit.idle+=dt;rabbit.x=clamp(rabbit.x,10,WW-10);rabbit.y=clamp(rabbit.y,16,WH-10);let tx=rabbit.x-W/2,ty=rabbit.y-H/2;cam.x+=(tx-cam.x)*Math.min(1,dt*4.5);cam.y+=(ty-cam.y)*Math.min(1,dt*4.5);cam.x=clamp(cam.x,0,WW-W);cam.y=clamp(cam.y,0,WH-H)}
function draw(){ground();drawHouse();for(const t of trees)tree(t);for(const r of rocks)rock(r);for(const f of foods)food(f);bunny();ctx.fillStyle='#fff5db0b';ctx.fillRect(0,0,W,H)}let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

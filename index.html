const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;

function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();startBgm()}if(audio.state==='suspended')audio.resume()}
function stopOsc(o){try{o&&o.stop()}catch(e){}}
function sfx(f=440,d=.05,type='square',v=.03){if(muted)return;ensureAudio();stopOsc(sfxOsc);let o=audio.createOscillator(),g=audio.createGain();sfxOsc=o;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);o.onended=()=>{if(sfxOsc===o)sfxOsc=null}}
function bgmNote(f,d=.08){if(muted||!audio)return;stopOsc(bgmOsc);let o=audio.createOscillator(),g=audio.createGain();bgmOsc=o;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.01,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);o.onended=()=>{if(bgmOsc===o)bgmOsc=null}}
function startBgm(){let i=0,n=[523,659,784,659,587,698,880,698,523,659,698,587];bgmTimer=setInterval(()=>{if(audio&&!muted)bgmNote(n[i++%n.length])},330)}
mute.onclick=()=>{muted=!muted;mute.textContent=muted?'×':'♪';ensureAudio()};

addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=0});
document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;const on=e=>{ensureAudio();keys[k]=1;e.preventDefault()},off=e=>{keys[k]=0;e.preventDefault()};b.onpointerdown=on;b.onpointerup=b.onpointercancel=b.onpointerleave=off});
act.onpointerdown=e=>{ensureAudio();interact();e.preventDefault()};
function hash(x,y){let n=x*374761393+y*668265263;n=(n^(n>>13))*1274126177;return(n^(n>>16))>>>0}
function rnd(x,y){return(hash(x,y)%10000)/10000}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function px(x,y,w=1,h=1,col='#fff'){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
const river={x:770,w:74},bridge={y:405,h:54},house={x:250,y:160,w:136,h:96,doorX:318,doorY:238},farm={x:1010,y:610,w:250,h:170};

const lines=['風がきもちいい','あの雲、にんじんみたい','橋の向こう行こうかな','今日は静かだな','草がふわふわ','畑、育ってるかな','井戸まで行こうかな','なんか落ちてないかな'],npcLines=['こんにちは','畑いってきたよ','眠くなってきた','川の音すき','にんじん見つけた？','井戸の水つめたいよ'];
function onBridge(x,y){return x>river.x-8&&x<river.x+river.w+8&&y>bridge.y&&y<bridge.y+bridge.h}function inRiver(x,y){return x>river.x&&x<river.x+river.w&&!onBridge(x,y)}
function collides(x,y){if(inRiver(x,y))return true;if(x>house.x-6&&x<house.x+house.w+6&&y>house.y+35&&y<house.y+house.h+8)return true;for(const t of trees)if(Math.hypot(x-t.x,y-(t.y+10))<15)return true;for(const r of rocks)if(Math.hypot(x-r.x,y-r.y)<12)return true;for(const w of waterSpots){let d=Math.hypot(x-w.x,y-w.y);if(w.type==='pond'&&d<w.r-5)return true;if(w.type==='well'&&d<18)return true}return false}
function nearHome(){return Math.hypot(rabbit.x-house.doorX,rabbit.y-house.doorY)<42}function nearWater(){let dx=Math.min(Math.abs(rabbit.x-river.x),Math.abs(rabbit.x-(river.x+river.w)));if(dx<25&&!onBridge(rabbit.x,rabbit.y))return true;for(const w of waterSpots)if(Math.hypot(rabbit.x-w.x,rabbit.y-w.y)<w.r+22)return true;return false}
function say(s,t=2){rabbit.bubbleText=s;rabbit.bubble=t}function nearestFood(){let b=null,d=999;for(const f of foods)if(!f.e){let q=Math.hypot(rabbit.x-f.x,rabbit.y-f.y);if(q<d){d=q;b=f}}return{f:b,d}}function nearestItem(){let b=null,d=999;for(const i of items){let q=Math.hypot(rabbit.x-i.x,rabbit.y-i.y);if(q<d){d=q;b=i}}return{i:b,d}}function nearestFarmCarrot(){let b=null,d=999;for(const f of farmCarrots)if(!f.e){let q=Math.hypot(rabbit.x-f.x,rabbit.y-f.y);if(q<d){d=q;b=f}}return{f:b,d}}
function interact(){let it=nearestItem();if(it.i&&it.d<28){say('ひろった！ '+it.i.icon,2.2);items.splice(items.indexOf(it.i),1);sfx(988,.06,'square',.045);return}let fc=nearestFarmCarrot();if(fc.f&&fc.d<30){fc.f.e=1;rabbit.hunger=Math.min(100,rabbit.hunger+34);say('畑のにんじん！ 🥕',2.2);sfx(900,.07,'square',.045);return}let n=nearestFood();if(n.f&&n.d<30){n.f.e=1;rabbit.hunger=Math.min(100,rabbit.hunger+48);say('おいしい！ 🥕');sfx(880,.08,'square',.05);return}if(nearWater()){rabbit.thirst=100;say('ごくごく… 💧');sfx(720,.10,'sine',.035);return}if(nearHome()){if(rabbit.sleep>45){rabbit.sleep=0;rabbit.home=0;rabbit.hunger=Math.min(100,rabbit.hunger+5);rabbit.thirst=Math.min(100,rabbit.thirst+5);say('すやすや… 💤',3);sfx(392,.18,'sine',.025)}else{rabbit.home=0;say('ただいま！ 🏠',2.3);sfx(523,.07,'square',.04)}return}say('…')}
function drawHomePath(){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#c9b47e';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(river.x-cam.x,bridge.y+bridge.h/2-cam.y);ctx.lineTo(665-cam.x,430-cam.y);ctx.lineTo(555-cam.x,380-cam.y);ctx.lineTo(455-cam.x,322-cam.y);ctx.lineTo(house.doorX-cam.x,house.doorY+20-cam.y);ctx.stroke();ctx.strokeStyle='#dbc98f';ctx.lineWidth=18;ctx.stroke();ctx.fillStyle='#d8c58d';ctx.beginPath();ctx.ellipse(house.doorX-cam.x,house.doorY+24-cam.y,38,23,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function ground(){ctx.fillStyle='#7eb95d';ctx.fillRect(0,0,W,H);for(const s of sand){ctx.fillStyle='#d8c27e';ctx.fillRect(s.x-cam.x,s.y-cam.y,s.w,s.h)}for(let ty=Math.floor(cam.y/T)-1;ty<Math.ceil((cam.y+H)/T)+1;ty++)for(let tx=Math.floor(cam.x/T)-1;tx<Math.ceil((cam.x+W)/T)+1;tx++){let x=tx*T-cam.x,y=ty*T-cam.y,r=rnd(tx,ty);if(r<.55){px(x+3+(hash(tx,ty)%8),y+8,1,4,'#5b9846');px(x+6,y+10,1,3,'#6aa650')}if(r>.90){px(x+7,y+6,1,1,'#ffe89d');px(x+6,y+7,3,1,'#f4d3d3')}}drawHomePath();drawRiver();drawFarm();drawEastDecor()}
function drawRiver(){let x=river.x-cam.x;ctx.fillStyle='#4f9fca';ctx.fillRect(x,-cam.y,river.w,WH);for(let yy=-20;yy<H+30;yy+=18){px(x+8,yy,18,2,'#7bc4e2');px(x+42,yy+9,22,2,'#75bad9')}let by=bridge.y-cam.y;px(x-8,by,river.w+16,bridge.h,'#9a6e45');for(let y=by+3;y<by+bridge.h;y+=8)px(x-5,y,river.w+10,4,'#c08b55')}
function drawFarm(){let x=farm.x-cam.x,y=farm.y-cam.y;ctx.fillStyle='#8b603e';ctx.fillRect(x,y,farm.w,farm.h);for(let yy=18;yy<farm.h-8;yy+=32){ctx.fillStyle='#6f472d';ctx.fillRect(x+10,y+yy,farm.w-20,8)}ctx.strokeStyle='#d8b071';ctx.lineWidth=4;ctx.strokeRect(x-3,y-3,farm.w+6,farm.h+6);for(const f of farmCarrots){if(f.e)continue;let fx=f.x-cam.x,fy=f.y-cam.y;px(fx,fy-8,2,6,'#3f833f');px(fx-2,fy-7,6,3,'#58a34f');px(fx-2,fy-1,6,9,'#e67b3d');px(fx-1,fy+8,4,2,'#c55d32')}}
function tree(t){let x=t.x-cam.x,y=t.y-cam.y;px(x-4,y+9,8,22,'#795236');px(x-18,y-10,36,26,'#417b43');px(x-12,y-18,26,18,'#4e8c4d');px(x-22,y,18,18,'#3f7540');px(x+7,y-2,17,19,'#4b8448')}function rock(r){let x=r.x-cam.x,y=r.y-cam.y;px(x-9,y-5,18,10,'#778178');px(x-6,y-8,11,3,'#9ca39a');px(x-7,y+5,14,2,'#5f6d64')}
function drawEastDecor(){let pathY=455-cam.y;ctx.fillStyle='#c9b781';ctx.fillRect(845-cam.x,pathY,570,30);for(let i=0;i<18;i++)px(860-cam.x+i*31,pathY+8+(i%3)*5,9,3,'#b6a472');let p=waterSpots[0],px0=p.x-cam.x,py0=p.y-cam.y;ctx.fillStyle='#3f8fba';ctx.beginPath();ctx.ellipse(px0,py0,50,35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#78c3df';ctx.beginPath();ctx.ellipse(px0-8,py0-5,29,13,0,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++)px(px0-48+i*13,py0+27-(i%2)*4,3,7,'#4c8945');for(const w of waterSpots){if(w.type!=='well')continue;let wx=w.x-cam.x,wy=w.y-cam.y;px(wx-17,wy-10,34,20,'#9a9b91');px(wx-14,wy-7,28,14,'#4f8ead');px(wx-20,wy-14,40,5,'#c2bda9');px(wx-15,wy-26,4,15,'#77563d');px(wx+11,wy-26,4,15,'#77563d');px(wx-15,wy-29,30,4,'#8c6547')}let bx=910-cam.x,by=525-cam.y;px(bx,by,42,5,'#9b6841');px(bx+4,by+8,34,4,'#865a3a');px(bx+5,by+12,4,10,'#684832');px(bx+33,by+12,4,10,'#684832');for(const t of [{x:905,y:210},{x:955,y:245},{x:1120,y:190},{x:1190,y:265},{x:1360,y:360},{x:1280,y:395}])tree(t);for(const r of [{x:900,y:365},{x:1180,y:410},{x:1360,y:560},{x:1270,y:160}])rock(r);for(const f of [[880,500],[935,565],[1000,520],[1080,500],[1150,540],[1230,515],[1340,500],[980,285],[1160,300],[1370,300]]){let x=f[0]-cam.x,y=f[1]-cam.y;px(x,y,1,4,'#4e8744');px(x-2,y-2,5,3,'#f2d4e0');px(x,y-3,1,1,'#ffe995')}}
function drawHouse(){let x=house.x-cam.x,y=house.y-cam.y;px(x,y+24,house.w,68,'#d8c08d');px(x+8,y+35,120,51,'#ead8aa');px(x-8,y+15,152,14,'#8a5640');px(x+6,y+5,124,16,'#a7634a');px(x+54,y+52,28,34,'#78543d');px(x+18,y+45,24,20,'#98c5d4');px(x+96,y+45,24,20,'#98c5d4')}
function food(f){if(f.e)return;let x=f.x-cam.x,y=f.y-cam.y;px(x,y-8,2,6,'#3f833f');px(x+2,y-7,3,2,'#519c4d');px(x-2,y-7,3,2,'#519c4d');px(x-2,y-2,6,10,'#e67b3d')}function item(i){let x=i.x-cam.x,y=i.y-cam.y;ctx.font='12px system-ui';ctx.fillText(i.icon,x-6,y+4)}

function drawPlayer(){let sx=rabbit.x-cam.x,sy=rabbit.y-cam.y,moving=keys.up||keys.down||keys.left||keys.right,step=moving?(Math.floor(rabbit.walk*10)%2):0,hop=moving&&step?1:0;ctx.save();ctx.translate(Math.round(sx),Math.round(sy-hop));ctx.fillStyle='#32452e55';ctx.fillRect(-7,9,14,3);let fur='#f2e8da',sh='#d9cbbb',pk='#db9da9',dk='#4b403b',d=rabbit.dir;

else if(d==='left'){px(-3,-15,3,9,fur);px(-2,-14,1,6,pk);px(2,-12,3,7,fur);px(-8,-7,12,9,fur);px(-7,-1,13,9,fur);px(-4,5,10,4,fur);if(step===0){px(-8,8,5,2,sh);px(0,6,5,2,sh)}else{px(-6,6,5,2,sh);px(2,8,5,2,sh)}px(-6,-5,1,1,dk);px(-8,-2,1,1,pk);px(5,3,3,3,fur)}
else{px(1,-15,3,9,fur);px(2,-14,1,6,pk);px(-5,-12,3,7,fur);px(-4,-7,12,9,fur);px(-6,-1,13,9,fur);px(-6,5,10,4,fur);if(step===0){px(-5,6,5,2,sh);px(3,8,5,2,sh)}else{px(-7,8,5,2,sh);px(1,6,5,2,sh)}px(6,-5,1,1,dk);px(8,-2,1,1,pk);px(-8,3,3,3,fur)}ctx.restore();drawBubble(sx,sy)}
function bubble(text,x,y){if(!text)return;ctx.save();ctx.font='9px system-ui';let tw=ctx.measureText(text).width+12,bx=clamp(x-tw/2,3,W-tw-3),by=y-40;ctx.fillStyle='#fff';ctx.fillRect(bx,by,tw,18);ctx.fillRect(x-2,by+17,6,5);ctx.fillStyle='#3d443e';ctx.fillText(text,bx+6,by+12);ctx.restore()}function thought(){if(rabbit.bubble>0)return rabbit.bubbleText;if(rabbit.sleep>78)return'ねむい… 💤';if(rabbit.thirst<30)return'のどかわいた… 💧';if(rabbit.hunger<30)return'おなかすいた… 🥕';if(rabbit.home>72)return'おうちに帰りたい… 🏠';return''}function drawBubble(x,y){bubble(thought(),x,y)}
function update(dt){rabbit.hunger=Math.max(0,rabbit.hunger-dt*.55);rabbit.thirst=Math.max(0,rabbit.thirst-dt*.82);rabbit.home=Math.min(100,rabbit.home+dt*.38);rabbit.sleep=Math.min(100,rabbit.sleep+dt*.34);rabbit.bubble=Math.max(0,rabbit.bubble-dt);hunger.style.width=rabbit.hunger+'%';thirst.style.width=rabbit.thirst+'%';homeNeed.style.width=rabbit.home+'%';sleepNeed.style.width=rabbit.sleep+'%';let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=rabbit.x+dx*rabbit.speed*dt,ny=rabbit.y+dy*rabbit.speed*dt;if(!collides(nx,rabbit.y))rabbit.x=nx;if(!collides(rabbit.x,ny))rabbit.y=ny;rabbit.walk+=dt;if(Math.abs(dx)>Math.abs(dy))rabbit.dir=dx<0?'left':'right';else rabbit.dir=dy<0?'up':'down';let warped=false;if(rabbit.x<8){rabbit.x=WW-8;warped=true}else if(rabbit.x>WW-8){rabbit.x=8;warped=true}if(rabbit.y<8){rabbit.y=WH-8;warped=true}else if(rabbit.y>WH-8){rabbit.y=8;warped=true}if(warped){cam.x=clamp(rabbit.x-W/2,0,WW-W);cam.y=clamp(rabbit.y-H/2,0,WH-H)}if(performance.now()-lastStep>235){lastStep=performance.now();sfx(260+((Math.floor(rabbit.walk*8)%2)*45),.025,'square',.012)}}for(const n of npcs){n.x+=n.dx*18*dt;n.y+=n.dy*18*dt;if(n.x<40||n.x>WW-40||collides(n.x,n.y)){n.dx*=-1;n.dy*=-1}if(Math.random()<dt*.18){n.dx=Math.cos(Math.random()*6.28);n.dy=Math.sin(Math.random()*6.28)}n.t=Math.max(0,n.t-dt)}randomTalkT-=dt;if(randomTalkT<0&&rabbit.bubble<=0){say(lines[Math.floor(Math.random()*lines.length)],2.4);let n=npcs[Math.floor(Math.random()*npcs.length)];n.txt=npcLines[Math.floor(Math.random()*npcLines.length)];n.t=2.5;randomTalkT=9+Math.random()*14}itemSpawnT-=dt;if(itemSpawnT<0&&items.length<6){let icons=['🍀','🌼','🪨','🍎','🌰','⭐'],x=80+Math.random()*(WW-160),y=80+Math.random()*(WH-160);if(!collides(x,y))items.push({x,y,icon:icons[Math.floor(Math.random()*icons.length)]});itemSpawnT=12+Math.random()*18}let tx=rabbit.x-W/2,ty=rabbit.y-H/2;cam.x+=(tx-cam.x)*Math.min(1,dt*4.5);cam.y+=(ty-cam.y)*Math.min(1,dt*4.5);cam.x=clamp(cam.x,0,WW-W);cam.y=clamp(cam.y,0,WH-H)}
function draw(){ground();drawHouse();for(const t of trees)tree(t);for(const r of rocks)rock(r);for(const f of foods)food(f);for(const i of items)item(i);for(const n of npcs){drawNpc(n.x,n.y,n.c,n.dx<-.2?'left':n.dx>.2?'right':'down');if(n.t>0)bubble(n.txt,n.x-cam.x,n.y-cam.y)}drawPlayer()}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
